name: C CI

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y build-essential
    - name: Build
      run: make
    - name: Package
      if: startsWith(github.ref, 'refs/tags/')
      run: make dist
    - name: Upload binary
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: linux-binary
        path: dungeonbash-*

  build_macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install deps
      run: brew install ncurses
    - name: Build
      run: make
    - name: Package
      if: startsWith(github.ref, 'refs/tags/')
      run: make dist
    - name: Upload binary
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: macos-binary
        path: dungeonbash-*

  release:
    needs: [build_linux, build_macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*/dungeonbash-*
        generate_release_notes: true
