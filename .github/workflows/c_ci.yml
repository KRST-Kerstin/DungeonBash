name: C CI
on:
  [push]
jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
    - name: Build
      run: make
  build_macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install deps
      run: brew install ncurses
    - name: Build
      run: make
